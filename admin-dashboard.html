<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard - Chanho FPO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7f5;
    color:#1f2937;
}

header{
    background:#126b3a;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.header-left h1{
    margin:0;
    font-size:24px;
}

.header-left p{
    margin:5px 0 0;
    opacity:.9;
}

.logout-btn{
    background:#fff;
    color:#126b3a;
    border:0;
    padding:10px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    width:95%;
    max-width:1400px;
    margin:25px auto;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.card h2{
    margin-top:0;
    color:#126b3a;
}

.area-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.area-box{
    background:#f1f8f4;
    border:1px solid #d9eadf;
    padding:15px;
    border-radius:8px;
}

.area-box small{
    color:#666;
    display:block;
    margin-bottom:5px;
}

.area-box strong{
    font-size:17px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.stat{
    padding:20px;
    border-radius:10px;
    background:#f7f7f7;
    border:1px solid #e5e5e5;
}

.stat h3{
    margin:0 0 8px;
    font-size:15px;
    color:#555;
}

.stat p{
    margin:0;
    font-size:28px;
    font-weight:bold;
}

.filters{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:12px;
}

input,select,textarea{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:14px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
}

th,td{
    padding:11px;
    border-bottom:1px solid #eee;
    text-align:left;
    vertical-align:top;
}

th{
    background:#126b3a;
    color:white;
    white-space:nowrap;
}

tr:hover{
    background:#fafafa;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.badge-pending{
    background:#fff3cd;
    color:#856404;
}

.badge-approved{
    background:#d1e7dd;
    color:#0f5132;
}

.badge-rejected{
    background:#f8d7da;
    color:#842029;
}

.badge-other{
    background:#e2e3e5;
    color:#41464b;
}

.btn{
    border:0;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    font-weight:bold;
    text-decoration:none;
    display:inline-block;
    margin:2px;
}

.btn-view{
    background:#0d6efd;
    color:white;
}

.btn-doc{
    background:#6f42c1;
    color:white;
}

.btn-verify{
    background:#198754;
    color:white;
}

.btn-reject{
    background:#dc3545;
    color:white;
}

.btn-close{
    background:#555;
    color:white;
}

.message{
    padding:12px;
    border-radius:7px;
    margin-bottom:15px;
    display:none;
}

.success{
    background:#d1e7dd;
    color:#0f5132;
}

.error{
    background:#f8d7da;
    color:#842029;
}

.loading{
    text-align:center;
    padding:30px;
    color:#666;
}

.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

/* Modal */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow:auto;
}

.modal-box{
    background:white;
    width:95%;
    max-width:900px;
    max-height:90vh;
    overflow:auto;
    border-radius:12px;
    padding:25px;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.modal-box h2{
    margin-top:0;
    color:#126b3a;
}

.detail-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.detail{
    background:#f7f7f7;
    padding:12px;
    border-radius:7px;
}

.detail strong{
    display:block;
    color:#555;
    font-size:12px;
    margin-bottom:4px;
}

.document-item{
    border:1px solid #ddd;
    border-radius:9px;
    padding:15px;
    margin-bottom:15px;
    background:#fafafa;
}

.document-item h3{
    margin-top:0;
    color:#126b3a;
}

.document-preview{
    max-width:300px;
    max-height:300px;
    display:block;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;
    object-fit:contain;
    background:white;
}

.no-document{
    color:#888;
    font-style:italic;
}

.close-row{
    text-align:right;
    margin-top:15px;
}

@media(max-width:900px){

    .area-grid,
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .filters{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    .area-grid,
    .stats,
    .detail-grid{
        grid-template-columns:1fr;
    }

    .container{
        width:94%;
    }

    header{
        padding:15px;
    }

    .header-left h1{
        font-size:20px;
    }
}
</style>
</head>

<body>

<header>

    <div class="header-left">
        <h1>Chanho FPO - Admin Dashboard</h1>
        <p id="adminWelcome">Loading...</p>
    </div>

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>

</header>


<div class="container">

    <div id="message" class="message"></div>


    <!-- ASSIGNED AREA -->

    <div class="card">

        <h2>My Assigned Area</h2>

        <div class="area-grid">

            <div class="area-box">
                <small>Admin ID</small>
                <strong id="areaAdminId">-</strong>
            </div>

            <div class="area-box">
                <small>Block</small>
                <strong id="areaBlock">-</strong>
            </div>

            <div class="area-box">
                <small>Panchayat</small>
                <strong id="areaPanchayat">-</strong>
            </div>

            <div class="area-box">
                <small>Village</small>
                <strong id="areaVillage">-</strong>
            </div>

        </div>

    </div>


    <!-- STATISTICS -->

    <div class="card">

        <h2>Farmer Statistics</h2>

        <div class="stats">

            <div class="stat">
                <h3>Total Farmers</h3>
                <p id="totalCount">0</p>
            </div>

            <div class="stat">
                <h3>Pending Verification</h3>
                <p id="pendingCount">0</p>
            </div>

            <div class="stat">
                <h3>Pending Officer Approval</h3>
                <p id="verifiedCount">0</p>
            </div>

            <div class="stat">
                <h3>Rejected</h3>
                <p id="rejectedCount">0</p>
            </div>

        </div>

    </div>


    <!-- FILTER -->

    <div class="card">

        <h2>Search Farmers</h2>

        <div class="filters">

            <input
                type="text"
                id="searchInput"
                placeholder="Search name, registration no, mobile..."
                oninput="applyFilters()"
            >

            <select id="statusFilter" onchange="applyFilters()">

                <option value="">All Status</option>

                <option value="Pending Admin Verification">
                    Pending Admin Verification
                </option>

                <option value="Pending Officer Approval">
                    Pending Officer Approval
                </option>

                <option value="Verified">
                    Verified
                </option>

                <option value="Rejected">
                    Rejected
                </option>

            </select>

            <select id="villageFilter" onchange="applyFilters()">
                <option value="">All Villages</option>
            </select>

        </div>

    </div>


    <!-- FARMER LIST -->

    <div class="card">

        <h2>Farmer Applications</h2>

        <div id="tableArea">

            <div class="loading">
                Loading farmers...
            </div>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://unqihzayhrpmtdxrjiyy.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_lBcosCFICJZK2rWm7AuZHQ_J3eA9tL4";

const { createClient } = supabase;

const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentAdmin = null;
let allFarmers = [];


/* =========================
   MESSAGE
========================= */

function showMessage(text, type = "success") {

    const box = document.getElementById("message");

    box.className = "message " + type;

    box.innerText = text;

    box.style.display = "block";

    setTimeout(() => {
        box.style.display = "none";
    }, 5000);
}


/* =========================
   LOGIN CHECK
========================= */

async function checkLogin() {

    const {
        data: sessionData,
        error: sessionError
    } = await db.auth.getSession();

    if (
        sessionError ||
        !sessionData ||
        !sessionData.session ||
        !sessionData.session.user
    ) {

        window.location.href = "admin-login.html";

        return false;
    }


    const user = sessionData.session.user;


    const {
        data: admin,
        error
    } = await db
        .from("admins")
        .select("*")
        .eq("auth_user_id", user.id)
        .maybeSingle();


    if (error) {

        console.error(error);

        showMessage(
            "Admin information load nahi ho paayi.",
            "error"
        );

        return false;
    }


    if (!admin) {

        await db.auth.signOut();

        alert(
            "Is Supabase account ka Admin record nahi mila."
        );

        window.location.href = "admin-login.html";

        return false;
    }


    if (
        String(admin.status || "").toLowerCase()
        !== "active"
    ) {

        await db.auth.signOut();

        alert(
            "Aapka Admin account Active nahi hai."
        );

        window.location.href = "admin-login.html";

        return false;
    }


    currentAdmin = admin;


    document.getElementById("adminWelcome").innerText =
        "Welcome, " +
        (admin.name || "Admin") +
        " (" +
        admin.admin_id +
        ")";


    return true;
}


/* =========================
   ASSIGNED AREA
========================= */

async function loadAssignedArea() {

    if (!currentAdmin) return;


    document.getElementById("areaAdminId").innerText =
        currentAdmin.admin_id || "-";


    const {
        data,
        error
    } = await db
        .from("admin_area_assignments")
        .select(`
            admin_id,
            block,
            panchayat,
            village,
            status,
            created_at
        `)
        .eq("admin_id", currentAdmin.admin_id)
        .eq("status", "Active")
        .order("created_at", {
            ascending: false
        })
        .limit(1)
        .maybeSingle();


    if (error) {

        console.error(error);

        showMessage(
            "Assigned area load nahi ho paaya.",
            "error"
        );

        return;
    }


    if (!data) {

        document.getElementById("areaBlock").innerText =
            "Not Assigned";

        document.getElementById("areaPanchayat").innerText =
            "Not Assigned";

        document.getElementById("areaVillage").innerText =
            "Not Assigned";

        return;
    }


    document.getElementById("areaBlock").innerText =
        data.block || "-";

    document.getElementById("areaPanchayat").innerText =
        data.panchayat || "-";

    document.getElementById("areaVillage").innerText =
        data.village || "-";
}


/* =========================
   LOAD FARMERS
========================= */

async function loadFarmers() {

    if (!currentAdmin) return;


    document.getElementById("tableArea").innerHTML =
        `<div class="loading">Loading farmers...</div>`;


    const {
        data,
        error
    } = await db
        .from("farmer")
        .select(`
            id,
            registration_no,
            name,
            father_name,
            mobile,
            gender,
            date_of_birth,
            village,
            panchayat,
            block,
            district,
            state,
            crop,
            land,
            category,
            address,
            status,
            aadhar_number,
            bank_name,
            bank_branch,
            account_number,
            ifsc_code,
            payment_mode,
            photo_url,
            signature_url,
            aadhar_url,
            form_url,
            land_record_url,
            admin_id,
            registered_at,
            admin_verified_at,
            admin_verified_by,
            admin_rejection_reason,
            officer_decision_at,
            officer_decision_by,
            officer_rejection_reason
        `)
        .eq("admin_id", currentAdmin.admin_id)
        .order("registered_at", {
            ascending: false
        });


    if (error) {

        console.error(error);

        document.getElementById("tableArea").innerHTML =
            `<div class="empty">
                Farmer data load nahi hua.<br><br>
                ${escapeHtml(error.message)}
            </div>`;

        return;
    }


    allFarmers = data || [];


    updateStatistics();

    populateVillageFilter();

    applyFilters();
}


/* =========================
   STATISTICS
========================= */

function updateStatistics() {

    const total = allFarmers.length;


    const pending = allFarmers.filter(
        f =>
            f.status ===
            "Pending Admin Verification"
    ).length;


    const verified = allFarmers.filter(
        f =>
            f.status ===
            "Pending Officer Approval"
    ).length;


    const rejected = allFarmers.filter(
        f =>
            String(f.status || "")
                .toLowerCase()
                .includes("rejected")
    ).length;


    document.getElementById("totalCount").innerText =
        total;

    document.getElementById("pendingCount").innerText =
        pending;

    document.getElementById("verifiedCount").innerText =
        verified;

    document.getElementById("rejectedCount").innerText =
        rejected;
}


/* =========================
   VILLAGE FILTER
========================= */

function populateVillageFilter() {

    const select =
        document.getElementById("villageFilter");


    const villages = [
        ...new Set(
            allFarmers
                .map(f => f.village)
                .filter(Boolean)
        )
    ].sort();


    select.innerHTML =
        `<option value="">All Villages</option>`;


    villages.forEach(village => {

        const option =
            document.createElement("option");

        option.value = village;

        option.textContent = village;

        select.appendChild(option);
    });
}


/* =========================
   FILTER
========================= */

function applyFilters() {

    const search =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    const status =
        document
            .getElementById("statusFilter")
            .value;


    const village =
        document
            .getElementById("villageFilter")
            .value;


    const filtered =
        allFarmers.filter(f => {

            const searchable = [

                f.registration_no,

                f.name,

                f.father_name,

                f.mobile,

                f.village,

                f.panchayat,

                f.block

            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


            const matchesSearch =
                !search ||
                searchable.includes(search);


            const matchesStatus =
                !status ||
                f.status === status;


            const matchesVillage =
                !village ||
                f.village === village;


            return (
                matchesSearch &&
                matchesStatus &&
                matchesVillage
            );
        });


    renderFarmers(filtered);
}


/* =========================
   RENDER FARMERS
========================= */

function renderFarmers(farmers) {

    if (!farmers.length) {

        document.getElementById("tableArea").innerHTML =
            `<div class="empty">
                Is filter ke according koi farmer nahi mila.
            </div>`;

        return;
    }


    let html = `

        <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>Registration No.</th>

                    <th>Farmer</th>

                    <th>Father/Husband</th>

                    <th>Mobile</th>

		    <th>Aadhaar</th>

		    <th>Village</th>

                    <th>Panchayat</th>

                    <th>Block</th>

                    <th>Status</th>

                    <th>Registered</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>
    `;


    farmers.forEach(farmer => {

        html += `

            <tr>

                <td>
                    <strong>
                        ${escapeHtml(
                            farmer.registration_no || "-"
                        )}
                    </strong>
                </td>

                <td>
                    ${escapeHtml(
                        farmer.name || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        farmer.father_name || "-"
                    )}
                </td>

                <td>
    ${escapeHtml(
        farmer.mobile || "-"
    )}
</td>

<td>
    ${escapeHtml(
        farmer.aadhar_number || "-"
    )}
</td>

<td>
    ${escapeHtml(
        farmer.village || "-"
    )}
</td>

                <td>
                    ${escapeHtml(
                        farmer.panchayat || "-"
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        farmer.block || "-"
                    )}
                </td>

                <td>
                    ${getStatusBadge(
                        farmer.status
                    )}
                </td>

                <td>
                    ${formatDate(
                        farmer.registered_at
                    )}
                </td>

                <td>

                    <button
                        class="btn btn-view"
                        onclick="viewFarmer(${farmer.id})"
                    >
                        View
                    </button>

                    <button
                        class="btn btn-doc"
                        onclick="openDocumentsById(${farmer.id})"
                    >
                        Documents
                    </button>

                    ${
                        farmer.status ===
                        "Pending Admin Verification"
                        ?
                        `
                        <button
                            class="btn btn-verify"
                            onclick="verifyFarmer(${farmer.id})"
                        >
                            Verify
                        </button>

                        <button
                            class="btn btn-reject"
                            onclick="rejectFarmer(${farmer.id})"
                        >
                            Reject
                        </button>
                        `
                        :
                        ""
                    }

                </td>

            </tr>

        `;
    });


    html += `

            </tbody>

        </table>

        </div>
    `;


    document.getElementById("tableArea").innerHTML =
        html;
}


/* =========================
   STATUS BADGE
========================= */

function getStatusBadge(status) {

    const value =
        status || "Unknown";


    let cls = "badge-other";


    if (
        value ===
        "Pending Admin Verification"
    ) {
        cls = "badge-pending";
    }


    if (
        value ===
        "Pending Officer Approval"
    ) {
        cls = "badge-approved";
    }


    if (
        value.toLowerCase()
            .includes("rejected")
    ) {
        cls = "badge-rejected";
    }


    return `
        <span class="badge ${cls}">
            ${escapeHtml(value)}
        </span>
    `;
}


/* =========================
   VIEW FARMER
========================= */

function viewFarmer(id) {

    const farmer =
        allFarmers.find(
            f => Number(f.id) === Number(id)
        );


    if (!farmer) return;


    const html = `

        <div class="modal-overlay"
             onclick="closeModal(event)">

            <div class="modal-box"
                 onclick="event.stopPropagation()">

                <h2>
                    Farmer Details
                </h2>


                <div class="detail-grid">

                    ${detail(
                        "Registration No.",
                        farmer.registration_no
                    )}

                    ${detail(
                        "Name",
                        farmer.name
                    )}

                    ${detail(
                        "Father/Husband",
                        farmer.father_name
                    )}

                    ${detail(
                        "Mobile",
                        farmer.mobile
                    )}

                    ${detail(
                        "Gender",
                        farmer.gender
                    )}

                    ${detail(
                        "Date of Birth",
                        farmer.date_of_birth
                    )}

                    ${detail(
                        "Village",
                        farmer.village
                    )}

                    ${detail(
                        "Panchayat",
                        farmer.panchayat
                    )}

                    ${detail(
                        "Block",
                        farmer.block
                    )}

                    ${detail(
                        "District",
                        farmer.district
                    )}

                    ${detail(
                        "State",
                        farmer.state
                    )}

                    ${detail(
                        "Crop",
                        farmer.crop
                    )}

                    ${detail(
                        "Land",
                        farmer.land
                    )}

                    ${detail(
                        "Category",
                        farmer.category
                    )}

                    ${detail(
                        "Aadhaar",
                        farmer.aadhar_number
                    )}

                    ${detail(
                        "Bank",
                        farmer.bank_name
                    )}

                    ${detail(
                        "Bank Branch",
                        farmer.bank_branch
                    )}

                    ${detail(
                        "Account No.",
                        farmer.account_number
                    )}

                    ${detail(
                        "IFSC",
                        farmer.ifsc_code
                    )}

                    ${detail(
                        "Payment Mode",
                        farmer.payment_mode
                    )}

                    ${detail(
                        "Address",
                        farmer.address
                    )}

                    ${detail(
                        "Status",
                        farmer.status
                    )}

                    ${detail(
                        "Registered At",
                        formatDate(
                            farmer.registered_at
                        )
                    )}

                    ${detail(
                        "Admin Verified By",
                        farmer.admin_verified_by
                    )}

                    ${detail(
                        "Admin Verified At",
                        formatDate(
                            farmer.admin_verified_at
                        )
                    )}

                </div>


                <div class="close-row">

                    <button
                        class="btn btn-close"
                        onclick="closeModal()"
                    >
                        Close
                    </button>

                </div>

            </div>

        </div>
    `;


    document.body.insertAdjacentHTML(
        "beforeend",
        html
    );
}


/* =========================
   DETAIL HELPER
========================= */

function detail(label, value) {

    return `
        <div class="detail">

            <strong>
                ${escapeHtml(label)}
            </strong>

            <span>
                ${escapeHtml(
                    value || "-"
                )}
            </span>

        </div>
    `;
}


/* =========================
   DOCUMENT URL
========================= */

function getDocumentUrl(path) {

    if (!path) return null;


    let value =
        String(path).trim();


    if (!value) return null;


    // Already a full URL
    if (
        value.startsWith("http://") ||
        value.startsWith("https://")
    ) {

        return value;
    }


    // Remove starting slash
    value =
        value.replace(/^\/+/, "");


    return (
        SUPABASE_URL +
        "/storage/v1/object/public/farmer-documents/" +
        value
    );
}


/* =========================
   OPEN DOCUMENTS BY ID
========================= */

function openDocumentsById(id) {

    const farmer =
        allFarmers.find(
            f => Number(f.id) === Number(id)
        );


    if (!farmer) {

        alert(
            "Farmer record nahi mila."
        );

        return;
    }


    openDocuments(farmer);
}


/* =========================
   OPEN DOCUMENTS
========================= */

function openDocuments(farmer) {

    const documents = [

        {
            title: "Farmer Photo",
            path: farmer.photo_url
        },

        {
            title: "Signature",
            path: farmer.signature_url
        },

        {
            title: "Aadhaar",
            path: farmer.aadhar_url
        },

        {
            title: "Application Form",
            path: farmer.form_url
        },

        {
            title: "Land Record",
            path: farmer.land_record_url
        }

    ];


    let html = `

        <div class="modal-overlay"
             onclick="closeModal(event)">

            <div class="modal-box"
                 onclick="event.stopPropagation()">

                <h2>
                    Farmer Documents
                </h2>

                <p>
                    Registration No:
                    <strong>
                        ${escapeHtml(
                            farmer.registration_no
                        )}
                    </strong>
                </p>
    `;


    documents.forEach(doc => {

        const url =
            getDocumentUrl(doc.path);


        html += `

            <div class="document-item">

                <h3>
                    ${escapeHtml(
                        doc.title
                    )}
                </h3>
        `;


        if (!url) {

            html += `

                <div class="no-document">
                    Document not available
                </div>

            `;

        } else {

            html += `

                <img
                    src="${escapeAttribute(url)}"
                    class="document-preview"
                    alt="${escapeAttribute(
                        doc.title
                    )}"
                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='block';
                    "
                >

                <div
                    class="no-document"
                    style="display:none;"
                >
                    Preview load nahi hua.
                    Neeche Open button se document dekhein.
                </div>


                <a
                    href="${escapeAttribute(url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn btn-view"
                >
                    Open
                </a>


                <a
                    href="${escapeAttribute(url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    download
                    class="btn btn-verify"
                >
                    Download
                </a>

            `;
        }


        html += `

            </div>

        `;
    });


    html += `

                <div class="close-row">

                    <button
                        class="btn btn-close"
                        onclick="closeModal()"
                    >
                        Close
                    </button>

                </div>

            </div>

        </div>
    `;


    document.body.insertAdjacentHTML(
        "beforeend",
        html
    );
}


/* =========================
   VERIFY FARMER
========================= */

async function verifyFarmer(id) {

    const farmer =
        allFarmers.find(
            f => Number(f.id) === Number(id)
        );


    if (!farmer) return;


    if (
        !confirm(
            "Kya aap is farmer application ko verify karna chahte hain?"
        )
    ) {
        return;
    }


    const {
        error
    } = await db
        .from("farmer")
        .update({

            status:
                "Pending Officer Approval",

            admin_verified_at:
                new Date().toISOString(),

            admin_verified_by:
                currentAdmin.admin_id,

            admin_rejection_reason:
                null

        })
        .eq("id", id)
        .eq(
            "admin_id",
            currentAdmin.admin_id
        );


    if (error) {

        console.error(error);

        alert(
            "Verification failed:\n" +
            error.message
        );

        return;
    }


    showMessage(
        "Farmer successfully verified. Ab application Officer Approval ke liye pending hai."
    );


    await loadFarmers();
}


/* =========================
   REJECT FARMER
========================= */

async function rejectFarmer(id) {

    const farmer =
        allFarmers.find(
            f => Number(f.id) === Number(id)
        );


    if (!farmer) return;


    const reason =
        prompt(
            "Reject karne ka reason likhiye:"
        );


    if (
        reason === null ||
        !reason.trim()
    ) {
        return;
    }


    const {
        error
    } = await db
        .from("farmer")
        .update({

            status: "Rejected",

            admin_verified_at:
                new Date().toISOString(),

            admin_verified_by:
                currentAdmin.admin_id,

            admin_rejection_reason:
                reason.trim()

        })
        .eq("id", id)
        .eq(
            "admin_id",
            currentAdmin.admin_id
        );


    if (error) {

        console.error(error);

        alert(
            "Reject failed:\n" +
            error.message
        );

        return;
    }


    showMessage(
        "Farmer application rejected."
    );


    await loadFarmers();
}


/* =========================
   CLOSE MODAL
========================= */

function closeModal(event) {

    if (
        event &&
        event.target !== event.currentTarget
    ) {
        return;
    }


    const modals =
        document.querySelectorAll(
            ".modal-overlay"
        );


    if (modals.length) {

        modals[
            modals.length - 1
        ].remove();

    }
}


/* =========================
   LOGOUT
========================= */

async function logout() {

    await db.auth.signOut();

    localStorage.removeItem("adminId");
    localStorage.removeItem("adminName");
    localStorage.removeItem("adminLoggedIn");

    window.location.href =
        "admin-login.html";
}


/* =========================
   HELPERS
========================= */

function formatDate(value) {

    if (!value) return "-";


    const date =
        new Date(value);


    if (isNaN(date.getTime())) {
        return String(value);
    }


    return date.toLocaleString(
        "en-IN",
        {
            dateStyle:"medium",
            timeStyle:"short"
        }
    );
}


function escapeHtml(value) {

    if (value === null ||
        value === undefined) {
        return "";
    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

    return escapeHtml(value);
}

startDashboard();
