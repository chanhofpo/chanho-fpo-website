<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password - Chanho FPO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef5f8;color:#1f2937;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.card{width:100%;max-width:430px;background:#fff;padding:24px;border-radius:15px;box-shadow:0 12px 35px rgba(0,0,0,.13)}
.logo{width:70px;height:70px;border-radius:50%;object-fit:contain;display:block;margin:0 auto 12px}
h2{text-align:center;color:#075e88;margin:0 0 8px}p{text-align:center;color:#667085;font-size:13px;line-height:1.5}
label{display:block;margin-top:15px;font-weight:700;font-size:13px}input{width:100%;padding:12px;margin-top:6px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
button{width:100%;padding:12px;margin-top:18px;border:0;border-radius:8px;background:#075e88;color:#fff;font-weight:700;cursor:pointer}
.msg{display:none;margin-top:13px;padding:10px;border-radius:8px;text-align:center;font-size:13px}.msg.error{display:block;background:#fef3f2;color:#b42318}.msg.success{display:block;background:#ecfdf3;color:#067647}
</style>
</head>
<body>
<div class="card">
<img class="logo" src="logo.png" alt="CBMS Logo">
<h2>Reset Password</h2>
<p>Recovery email के link से यह page खोलने के बाद नया password set करें.</p>
<label>New Password</label>
<input id="password" type="password" minlength="8" placeholder="कम से कम 8 characters">
<label>Confirm Password</label>
<input id="confirmPassword" type="password" minlength="8" placeholder="Password दोबारा डालें">
<button id="saveBtn" onclick="savePassword()">Save New Password</button>
<div id="message" class="msg"></div>
</div>
<script>
const db=window.supabase.createClient("https://unqihzayhrpmtdxrjiyy.supabase.co","sb_publishable_lBcosCFICJZK2rWm7AuZHQ_J3eA9tL4");
function showMessage(t,type){const m=document.getElementById("message");m.textContent=t;m.className="msg "+type;}
async function savePassword(){
 const password=document.getElementById("password").value;
 const confirm=document.getElementById("confirmPassword").value;
 const btn=document.getElementById("saveBtn");
 if(password.length<8){showMessage("Password कम से कम 8 characters का रखें।","error");return;}
 if(password!==confirm){showMessage("दोनों password match नहीं कर रहे।","error");return;}
 btn.disabled=true;btn.textContent="Saving...";
 try{
   const {data:sessionData}=await db.auth.getSession();
   if(!sessionData||!sessionData.session){
     showMessage("Recovery session नहीं मिला। Email का latest reset link दोबारा खोलें।","error");
     return;
   }
   const {error}=await db.auth.updateUser({password});
   if(error) throw error;
   showMessage("Password successfully बदल गया। अब Login page से login करें।","success");
   setTimeout(()=>{window.location.href="index.html";},2200);
 }catch(error){console.error(error);showMessage("Password update failed: "+(error.message||error),"error");}
 finally{btn.disabled=false;btn.textContent="Save New Password";}
}
</script>
</body>
</html>
