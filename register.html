<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmer Registration - Chanho FPO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f8f4;
    color:#173b24;
}
.header{
    background:#087a35;
    color:white;
    padding:22px 15px;
    text-align:center;
}
.header h1{margin:0;font-size:25px}
.header p{margin:7px 0 0;font-size:14px}

.container{
    max-width:900px;
    margin:25px auto;
    padding:0 15px;
}
.card{
    background:white;
    border-radius:14px;
    padding:25px;
    box-shadow:0 4px 18px rgba(0,0,0,.10);
}
.section-title{
    background:#087a35;
    color:white;
    padding:11px 14px;
    border-radius:8px;
    margin:20px 0 15px;
    font-size:18px;
}
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}
.field{margin-bottom:5px}
label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
    font-size:14px;
}
input,select,textarea{
    width:100%;
    padding:11px;
    border:1px solid #c8d8ce;
    border-radius:7px;
    font-size:15px;
}
textarea{min-height:80px;resize:vertical}
.full{grid-column:1/-1}

.upload-box{
    border:1px dashed #9ab9a4;
    padding:12px;
    border-radius:8px;
    background:#f8fcf9;
}
.upload-box input{border:0;padding:5px 0}

button{
    width:100%;
    border:0;
    background:#087a35;
    color:white;
    padding:14px;
    border-radius:8px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:15px;
}
button:disabled{
    background:#8ba995;
    cursor:not-allowed;
}
.note{
    font-size:12px;
    color:#666;
    margin-top:5px;
}
#message{
    margin-top:20px;
    padding:15px;
    border-radius:8px;
    display:none;
    text-align:center;
    font-weight:bold;
}
.success{
    background:#e4f7e9;
    color:#12652d;
}
.error{
    background:#ffe9e9;
    color:#a40000;
}
.registration{
    font-size:25px;
    color:#087a35;
    margin-top:8px;
}
@media(max-width:650px){
    .grid{grid-template-columns:1fr}
    .full{grid-column:auto}
    .card{padding:18px}
}
</style>
</head>

<body>

<div class="header">
    <h1>Chanho Birsa Munda Sangathan Producer Company Limited</h1>
    <p>Farmer Registration Form</p>
</div>

<div class="container">
<div class="card">

<form id="farmerForm">

<div class="section-title">1. व्यक्तिगत जानकारी</div>

<div class="grid">

<div class="field">
<label>किसान का नाम *</label>
<input type="text" id="name" required>
</div>

<div class="field">
<label>पिता / पति का नाम *</label>
<input type="text" id="father_name" required>
</div>

<div class="field">
<label>जन्म तिथि *</label>
<input type="date" id="date_of_birth" required>
</div>

<div class="field">
<label>लिंग *</label>
<select id="gender" required>
<option value="">Select</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="field">
<label>आधार नंबर *</label>
<input type="text" id="aadhar_number"
       inputmode="numeric"
       maxlength="12"
       pattern="[0-9]{12}"
       placeholder="12 digit Aadhaar"
       required>
</div>

<div class="field">
<label>मोबाइल नंबर *</label>
<input type="tel" id="mobile"
       inputmode="numeric"
       maxlength="10"
       pattern="[0-9]{10}"
       placeholder="10 digit mobile"
       required>
</div>

</div>

<div class="section-title">2. पता</div>

<div class="grid">

<div class="field">
<label>गाँव *</label>
<input type="text" id="village" required>
</div>

<div class="field">
<label>पंचायत *</label>
<input type="text" id="panchayat" required>
</div>

<div class="field">
<label>Block *</label>
<select id="block" required>
<option value="">Select Block</option>
<option>Chanho</option>
<option>Mandar</option>
</select>
</div>

<div class="field">
<label>District</label>
<input type="text" id="district" value="Ranchi" readonly>
</div>

<div class="field">
<label>State</label>
<input type="text" id="state" value="Jharkhand" readonly>
</div>

<div class="field full">
<label>पूरा पता *</label>
<textarea id="address" required></textarea>
</div>

</div>

<div class="section-title">3. कृषि जानकारी</div>

<div class="grid">

<div class="field">
<label>मुख्य फसल *</label>
<input type="text" id="crop" placeholder="जैसे धान, मक्का, गेहूँ" required>
</div>

<div class="field">
<label>भूमि / Land *</label>
<input type="text" id="land" placeholder="जैसे 2 एकड़" required>
</div>

<div class="field">
<label>Category *</label>
<select id="category" required>
<option value="">Select Category</option>
<option>General</option>
<option>OBC</option>
<option>SC</option>
<option>ST</option>
<option>Other</option>
</select>
</div>

</div>

<div class="section-title">4. Bank Details</div>

<div class="grid">

<div class="field">
<label>Bank Name *</label>
<input type="text" id="bank_name" required>
</div>

<div class="field">
<label>Branch Name *</label>
<input type="text" id="bank_branch" required>
</div>

<div class="field">
<label>Account Number *</label>
<input type="text" id="account_number"
       inputmode="numeric" required>
</div>

<div class="field">
<label>IFSC Code *</label>
<input type="text" id="ifsc_code"
       maxlength="11"
       style="text-transform:uppercase"
       required>
</div>

</div>

<div class="section-title">5. Payment Details</div>

<div class="grid">

<div class="field">
<label>Payment Mode *</label>
<select id="payment_mode" required>
<option value="">Select Payment Mode</option>
<option>Cash</option>
<option>UPI</option>
</select>
</div>

</div>

<div class="section-title">6. Documents Upload</div>

<p class="note">
कृपया साफ और पढ़ने योग्य documents upload करें। Aadhaar और अन्य documents को private रखा जाएगा।
</p>

<div class="grid">

<div class="field">
<label>Photo *</label>
<div class="upload-box">
<input type="file" id="photo" accept="image/*" required>
</div>
</div>

<div class="field">
<label>Signature *</label>
<div class="upload-box">
<input type="file" id="signature" accept="image/*" required>
</div>
</div>

<div class="field">
<label>Aadhaar Card *</label>
<div class="upload-box">
<input type="file" id="aadhar_file"
       accept="image/*,.pdf" required>
</div>
</div>

<div class="field">
<label>Form *</label>
<div class="upload-box">
<input type="file" id="form_file"
       accept="image/*,.pdf" required>
</div>
</div>

<div class="field full">
<label>Land Record *</label>
<div class="upload-box">
<input type="file" id="land_record"
       accept="image/*,.pdf" required>
</div>
</div>

</div>

<button type="submit" id="submitBtn">
Submit Farmer Registration
</button>

</form>

<div id="message"></div>

</div>
</div>

<script>

const SUPABASE_URL = "https://unqihzayhrpmtdxrjiyy.supabase.co";
const SUPABASE_KEY = "sb_publishable_lBcosCFICJZK2rWm7AuZHQ_J3eA9tL4";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById("farmerForm");
const ADMIN_ID = "ADM/2026/01";
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");

function showMessage(text, type){
    message.style.display = "block";
    message.className = type;
    message.innerHTML = text;
    window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

function getValue(id){
    return document.getElementById(id).value.trim();
}

async function uploadFile(file, folder){

    if(!file) return null;

    const extension = file.name.split(".").pop().toLowerCase();

    const randomPart =
        Date.now() + "_" +
        Math.random().toString(36).substring(2,10);

    const filePath =
        folder + "/" + randomPart + "." + extension;

    const { error } = await db.storage
        .from("farmer-documents")
        .upload(filePath, file, {
            cacheControl: "3600",
            upsert: false
        });

    if(error){
        throw new Error("Document upload failed: " + error.message);
    }

    return filePath;
}

form.addEventListener("submit", async function(e){

    e.preventDefault();

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";

    message.style.display = "none";

    try{

        const aadhar = getValue("aadhar_number");

        if(!/^[0-9]{12}$/.test(aadhar)){
            throw new Error("Aadhaar number 12 digit का होना चाहिए।");
        }

        const mobile = getValue("mobile");

        if(!/^[0-9]{10}$/.test(mobile)){
            throw new Error("Mobile number 10 digit का होना चाहिए।");
        }

        const files = {
            photo: document.getElementById("photo").files[0],
            signature: document.getElementById("signature").files[0],
            aadhar_file: document.getElementById("aadhar_file").files[0],
            form_file: document.getElementById("form_file").files[0],
            land_record: document.getElementById("land_record").files[0]
        };

        for(const key in files){
            if(!files[key]){
                throw new Error("सभी documents upload करना जरूरी है।");
            }
        }

        const photo_url =
            await uploadFile(files.photo, "photo");

        const signature_url =
            await uploadFile(files.signature, "signature");

        const aadhar_url =
            await uploadFile(files.aadhar_file, "aadhar");

        const form_url =
            await uploadFile(files.form_file, "form");

        const land_record_url =
            await uploadFile(files.land_record, "land-record");

        const { data, error } = await db.rpc(
            "register_farmer",
            {
                p_name: getValue("name"),
                p_father_name: getValue("father_name"),
                p_date_of_birth: getValue("date_of_birth"),
                p_aadhar_number: aadhar,
                p_mobile: mobile,
                p_gender: getValue("gender"),
                p_village: getValue("village"),
                p_panchayat: getValue("panchayat"),
                p_block: getValue("block"),
                p_district: "Ranchi",
                p_state: "Jharkhand",
                p_crop: getValue("crop"),
                p_land: getValue("land"),
                p_category: getValue("category"),
                p_address: getValue("address"),
                p_bank_name: getValue("bank_name"),
                p_bank_branch: getValue("bank_branch"),
                p_account_number: getValue("account_number"),
                p_ifsc_code: getValue("ifsc_code").toUpperCase(),
                p_payment_mode: getValue("payment_mode"),
                p_photo_url: photo_url,
                p_signature_url: signature_url,
                p_aadhar_url: aadhar_url,
                p_form_url: form_url,
                p_land_record_url: land_record_url,
                p_admin_id: ADMIN_ID
            }
        );

        if(error){
            throw new Error(error.message);
        }

        showMessage(
            "Registration Successful!<div class='registration'>" +
            data +
            "</div><br>" +
            "कृपया अपना Registration Number सुरक्षित रखें।",
            "success"
        );

        form.reset();

    }catch(error){

        console.error(error);

        showMessage(
            "Registration failed:<br>" + error.message,
            "error"
        );

    }finally{

        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Farmer Registration";

    }

});

<script>

const SUPABASE_URL = "https://unqihzayhrpmtdxrjiyy.supabase.co";
const SUPABASE_KEY = "sb_publishable_lBcosCFICJZK2rWm7AuZHQ_J3eA9tL4";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById("farmerForm");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");

let ADMIN_ID = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text, type){

    message.style.display = "block";
    message.className = type;
    message.innerHTML = text;

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}


/* =========================
   GET VALUE
========================= */

function getValue(id){

    return document.getElementById(id).value.trim();

}


/* =========================
   FIND LOGGED-IN ADMIN
========================= */

async function loadAdmin(){

    const {
        data: { session },
        error: sessionError
    } = await db.auth.getSession();


    if(sessionError){

        throw new Error(
            "Admin session check failed: " +
            sessionError.message
        );

    }


    if(!session){

        throw new Error(
            "Farmer Registration के लिए पहले Admin Login करें।"
        );

    }


    const authUserId = session.user.id;


    const {
        data,
        error
    } = await db
        .from("admins")
        .select("admin_id,name,status")
        .eq("auth_user_id", authUserId)
        .single();


    if(error){

        throw new Error(
            "Admin record नहीं मिला: " +
            error.message
        );

    }


    if(!data.admin_id){

        throw new Error(
            "इस Admin की Admin ID उपलब्ध नहीं है।"
        );

    }


    if(data.status && data.status !== "Active"){

        throw new Error(
            "यह Admin account Active नहीं है।"
        );

    }


    ADMIN_ID = data.admin_id;


    console.log(
        "Logged-in Admin:",
        ADMIN_ID
    );

}


/* =========================
   FILE UPLOAD
========================= */

async function uploadFile(file, folder){

    if(!file) return null;


    const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();


    const randomPart =
        Date.now() +
        "_" +
        Math.random()
        .toString(36)
        .substring(2,10);


    const filePath =
        folder +
        "/" +
        randomPart +
        "." +
        extension;


    const { error } = await db.storage
        .from("farmer-documents")
        .upload(
            filePath,
            file,
            {
                cacheControl: "3600",
                upsert: false
            }
        );


    if(error){

        throw new Error(
            "Document upload failed: " +
            error.message
        );

    }


    return filePath;

}


/* =========================
   FORM SUBMIT
========================= */

form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        submitBtn.disabled = true;

        submitBtn.textContent =
            "Submitting...";


        message.style.display =
            "none";


        try{


            /* =====================
               CHECK ADMIN
            ===================== */

            if(!ADMIN_ID){

                await loadAdmin();

            }


            console.log(
                "Farmer assigned to Admin:",
                ADMIN_ID
            );


            /* =====================
               AADHAAR
            ===================== */

            const aadhar =
                getValue("aadhar_number");


            if(!/^[0-9]{12}$/.test(aadhar)){

                throw new Error(
                    "Aadhaar number 12 digit का होना चाहिए।"
                );

            }


            /* =====================
               MOBILE
            ===================== */

            const mobile =
                getValue("mobile");


            if(!/^[0-9]{10}$/.test(mobile)){

                throw new Error(
                    "Mobile number 10 digit का होना चाहिए।"
                );

            }


            /* =====================
               FILES
            ===================== */

            const files = {

                photo:
                    document.getElementById(
                        "photo"
                    ).files[0],

                signature:
                    document.getElementById(
                        "signature"
                    ).files[0],

                aadhar_file:
                    document.getElementById(
                        "aadhar_file"
                    ).files[0],

                form_file:
                    document.getElementById(
                        "form_file"
                    ).files[0],

                land_record:
                    document.getElementById(
                        "land_record"
                    ).files[0]

            };


            for(const key in files){

                if(!files[key]){

                    throw new Error(
                        "सभी documents upload करना जरूरी है।"
                    );

                }

            }


            /* =====================
               UPLOAD DOCUMENTS
            ===================== */

            const photo_url =
                await uploadFile(
                    files.photo,
                    "photo"
                );


            const signature_url =
                await uploadFile(
                    files.signature,
                    "signature"
                );


            const aadhar_url =
                await uploadFile(
                    files.aadhar_file,
                    "aadhar"
                );


            const form_url =
                await uploadFile(
                    files.form_file,
                    "form"
                );


            const land_record_url =
                await uploadFile(
                    files.land_record,
                    "land-record"
                );


            /* =====================
               REGISTER FARMER
            ===================== */

            const {
                data,
                error
            } = await db.rpc(
                "register_farmer",
                {

                    p_name:
                        getValue("name"),

                    p_father_name:
                        getValue("father_name"),

                    p_date_of_birth:
                        getValue("date_of_birth"),

                    p_aadhar_number:
                        aadhar,

                    p_mobile:
                        mobile,

                    p_gender:
                        getValue("gender"),

                    p_village:
                        getValue("village"),

                    p_panchayat:
                        getValue("panchayat"),

                    p_block:
                        getValue("block"),

                    p_district:
                        "Ranchi",

                    p_state:
                        "Jharkhand",

                    p_crop:
                        getValue("crop"),

                    p_land:
                        getValue("land"),

                    p_category:
                        getValue("category"),

                    p_address:
                        getValue("address"),

                    p_bank_name:
                        getValue("bank_name"),

                    p_bank_branch:
                        getValue("bank_branch"),

                    p_account_number:
                        getValue("account_number"),

                    p_ifsc_code:
                        getValue("ifsc_code")
                        .toUpperCase(),

                    p_payment_mode:
                        getValue("payment_mode"),

                    p_photo_url:
                        photo_url,

                    p_signature_url:
                        signature_url,

                    p_aadhar_url:
                        aadhar_url,

                    p_form_url:
                        form_url,

                    p_land_record_url:
                        land_record_url,

                    /* IMPORTANT */
                    p_admin_id:
                        ADMIN_ID

                }
            );


            /* =====================
               RPC ERROR
            ===================== */

            if(error){

                throw new Error(
                    error.message
                );

            }


            /* =====================
               SUCCESS
            ===================== */

            showMessage(

                "Registration Successful!" +

                "<div class='registration'>" +

                data +

                "</div>" +

                "<br>" +

                "Admin ID: " +

                ADMIN_ID +

                "<br><br>" +

                "कृपया अपना Registration Number सुरक्षित रखें।",

                "success"

            );


            form.reset();


        }
        catch(error){

            console.error(error);


            showMessage(

                "Registration failed:<br>" +

                error.message,

                "error"

            );

        }
        finally{

            submitBtn.disabled =
                false;

            submitBtn.textContent =
                "Submit Farmer Registration";

        }

    }
);


/* =========================
   PAGE LOAD
========================= */

loadAdmin()
.then(() => {

    console.log(
        "Admin Registration Ready:",
        ADMIN_ID
    );

})
.catch(error => {

    console.error(error);

    showMessage(
        error.message,
        "error"
    );

});

</script>

</body>
</html>
